<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SM Lazysub - Кино Сан</title>
<script src="https://telegram.org"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background-color: #0f0f0f; color: #ffffff; padding-bottom: 30px; }
.header { position: sticky; top: 0; background-color: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px); padding: 12px 12px 8px 12px; z-index: 100; border-bottom: 1px solid #222; }
.search-box { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #333; background-color: #1c1c1e; color: #fff; font-size: 14px; outline: none; }
.search-box::placeholder { color: #888; }
.categories { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px 0; scrollbar-width: none; }
.categories::-webkit-scrollbar { display: none; }
.cat-btn { background-color: #222; color: #ccc; border: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.cat-btn.active { background-color: #e50914; color: #fff; font-weight: 600; }
.movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
@media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(5, 1fr); max-width: 900px; margin: 0 auto; } }
.movie-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; border-radius: 8px; overflow: hidden; }
.movie-card:active { transform: scale(0.96); }
.poster-wrapper { width: 100%; aspect-ratio: 2 / 3; background-color: #1e1e1e; border-radius: 8px; overflow: hidden; }
.poster-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
.movie-title { margin-top: 6px; font-size: 12px; font-weight: 500; line-height: 1.3; color: #eaeaea; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; }
.loading, .no-results { text-align: center; padding: 40px 20px; color: #888; font-size: 14px; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="header">
<input type="text" id="searchInput" class="search-box" placeholder="Киноны нэрээр хайх...">
<div class="categories" id="categoryList"><button class="cat-btn active" data-cat="Бүгд">Бүгд</button></div>
</div>
<div class="movie-grid" id="movieGrid"><div class="loading">Кинонуудыг ачаалж байна...</div></div>

<script>
if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.expand(); }

const u1 = "https:" + "//docs." + "://google.com";
const u2 = "2PACX-1vQcypn9JnnLmqj6THxIzIJQ07qWnSENkdoOa0qskD1AJWI3EbJoXNq4EpTi1HZvK_vDhTz9Bt4U8_N4";
const u3 = "/pub?gid=0&single=true&output=csv";
const CSV_URL = u1 + u2 + u3;

let allMovies = [];
let activeCategory = "Бүгд";

function parseCSV(text) {
  const rows = []; let row = []; let cell = ''; let inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i]; const nc = text[i + 1];
    if (inQ) {
      if (c === '"' && nc === '"') { cell += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else { cell += c; }
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(cell.trim()); cell = ''; }
      else if (c === '\n' || (c === '\r' && nc === '\n')) {
        row.push(cell.trim());
        if (row.some(x => x !== '')) rows.push(row);
        row = []; cell = '';
        if (c === '\r') i++;
      } else { cell += c; }
    }
  }
  if (cell !== '' || row.length > 0) {
    row.push(cell.trim());
    if (row.some(x => x !== '')) rows.push(row);
  }
  return rows;
}

async function loadMovies() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('Сүлжээний алдаа');
    const txt = await res.text();
    const rows = parseCSV(txt);
    if (rows.length < 2) { document.getElementById('movieGrid').innerHTML = '<div class="no-results">Хүснэгт хоосон байна.</div>'; return; }
    
    const firstRow = rows.shift();
    const h = firstRow.map(x => String(x).toLowerCase().trim());
    const tI = h.indexOf('title');
    const cI = h.indexOf('category');
    const pI = h.indexOf('poster');
    const lI = h.indexOf('link');

    allMovies = rows.map(r => ({
      title: r[tI] || '',
      category: r[cI] || '',
      poster: r[pI] || '',
      link: r[lI] || ''
    })).filter(m => m.title && m.poster && m.link);

    generateCategories();
    renderMovies();
  } catch (e) {
    document.getElementById('movieGrid').innerHTML = '<div class="no-results">Алдаа: ' + e.message + '</div>';
  }
}

function generateCategories() {
  const set = new Set();
  allMovies.forEach(m => { if (m.category) m.category.split(',').forEach(c => { if (c.trim()) set.add(c.trim()); }); });
  const box = document.getElementById('categoryList');
  set.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-btn'; b.textContent = c; b.dataset.cat = c;
    b.onclick = () => { activeCategory = c; document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); renderMovies(); };
    box.appendChild(b);
  });
}

function renderMovies() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const grid = document.getElementById('movieGrid');
  grid.innerHTML = '';
  const filtered = allMovies.filter(m => {
    const mSearch = m.title.toLowerCase().includes(q);
    let mCat = true;
    if (activeCategory !== "Бүгд") { mCat = m.category ? m.category.split(',').map(x => x.trim()).includes(activeCategory) : false; }
    return mSearch && mCat;
  });
  if (filtered.length === 0) { grid.innerHTML = '<div class="no-results">Илэрц олдсонгүй.</div>'; return; }
  filtered.forEach(m => {
    const a = document.createElement('a');
    a.className = 'movie-card'; a.href = m.link; a.target = "_blank";
    a.onclick = (e) => { if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink && m.link.includes('t.me')) { e.preventDefault(); window.Telegram.WebApp.openTelegramLink(m.link); } };
    const wrap = document.createElement('div'); wrap.className = 'poster-wrapper';
    const img = document.createElement('img'); img.src = m.poster; img.alt = m.title; img.loading = 'lazy';
    wrap.appendChild(img);
    const title = document.createElement('div'); title.className = 'movie-title'; title.textContent = m.title;
    a.appendChild(wrap); a.appendChild(title);
    grid.appendChild(a);
  });
}

document.getElementById('searchInput').addEventListener('input', renderMovies);
loadMovies();
</script>
</body>
</html>
